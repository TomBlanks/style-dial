# Publishes the plain HTML example as a live demo, so anyone can try the panel
# without installing Claude Code.
name: Demo

on:
  push:
    branches: [main]
    paths: [examples/plain-html/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: examples/plain-html
      - id: deployment
        uses: actions/deploy-pages@v4
